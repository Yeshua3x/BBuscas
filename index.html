<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Sistema de Busca</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  min-height: 100vh;
  padding: 40px 20px;
  line-height: 1.6;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
  overflow: hidden;
  animation: slideUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.search-box {
  padding: 40px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(248, 250, 252, 0.8));
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
  position: relative;
}

input {
  width: 100%;
  padding: 20px 24px;
  font-size: 18px;
  border: 2px solid transparent;
  border-radius: 16px;
  background: rgba(255, 255, 255, 1);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
  outline: none;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  caret-color: #667eea;
}

input:focus {
  border-color: #667eea;
  box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15), 0 20px 50px rgba(102, 126, 234, 0.2);
  transform: translateY(-2px);
}

input::placeholder { color: #9ca3af; font-weight: 500; }

#results {
  padding: 0;
  max-height: 70vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(102, 126, 234, 0.3) transparent;
}

#results::-webkit-scrollbar { width: 8px; }
#results::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.5); border-radius: 4px; }
#results::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.4); border-radius: 4px; }

.result {
  border-bottom: none;
  padding: 28px 40px;
  background: white;
  margin: 0 40px 2px;
  border-radius: 20px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  transform: translateY(20px);
  opacity: 0;
  animation: slideInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  position: relative;
  overflow: hidden;
}

.result::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #667eea, #764ba2);
  transform: scaleX(0);
  transition: transform 0.3s ease;
}

.result:hover::before { transform: scaleX(1); }
.result:hover { transform: translateY(-6px); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15); }

.result:nth-child(1) { animation-delay: 0.1s; }
.result:nth-child(2) { animation-delay: 0.2s; }
.result:nth-child(3) { animation-delay: 0.3s; }
.result:nth-child(4) { animation-delay: 0.4s; }
.result:nth-child(5) { animation-delay: 0.5s; }

@keyframes slideInUp {
  to { opacity: 1; transform: translateY(0); }
}

.highlight {
  background: linear-gradient(120deg, #fef3c7, #fde68a);
  color: #92400e;
  padding: 4px 8px;
  border-radius: 8px;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(254, 243, 199, 0.4);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@media (max-width: 768px) {
  body { padding: 20px 10px; }
  .search-box, .result { padding: 24px 20px; margin: 0 10px 2px; }
  input { font-size: 16px; padding: 18px 20px; }
}
  </style>
</head>
<body>
  <h1>Sistema de Busca com JSON externo</h1>
  <input type="text" id="searchInput" placeholder="Digite uma palavra‑chave..." />

  <div id="results"></div>

  <script>

  // URL do JSON (pode ser local ou de um servidor)
const URL_JSON = "./dados.json";

// Variável para armazenar os dados carregados
let dados = [];

// Carrega o JSON externo
fetch(URL_JSON)
  .then((response) => response.json())
  .then((json) => {
    dados = json;
  })
  .catch((error) => {
    console.error("Erro ao carregar JSON:", error);
  });

// Campo de busca
const searchInput = document.getElementById("searchInput");
const results = document.getElementById("results");

// Função de busca (case insensitive)
function buscar(termos) {
  const termosMin = termos.toLowerCase();

  const resultadosFiltrados = dados.filter((item) => {
    const titulo = item.titulo.toLowerCase();
    const descricao = item.descricao.toLowerCase();
    return titulo.includes(termosMin) || descricao.includes(termosMin);
  });

  // Monta a lista de resultados
  results.innerHTML = "";
  resultadosFiltrados.forEach((item) => {
    const tit = item.titulo.replace(
      new RegExp(termos, "gi"),
      (match) => `<span class="highlight">${match}</span>`
    );
    const desc = item.descricao.replace(
      new RegExp(termos, "gi"),
      (match) => `<span class="highlight">${match}</span>`
    );

    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `<b>${tit}</b><br><small>${desc}</small>`;
    results.appendChild(div);
  });

  if (resultadosFiltrados.length === 0 && termos) {
    results.innerHTML = "<p>Nenhum resultado encontrado.</p>";
  }
}

// Dispara a busca ao digitar
searchInput.addEventListener("input", (e) => {
  buscar(e.target.value.trim());
});
</script>
</body>
</html>
